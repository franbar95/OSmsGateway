<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js" integrity="sha384-JEW9xMcG8R+pH31jmWH6WWP0WintQrMb4s7ZOdauHnUtxwoG2vI5DkLtS3qm9Ekf" crossorigin="anonymous"></script>
    <script>
        // Mensajes para cada estado. "Enviado" NO significa entregado.
        var MENSAJES = {
            QUEUED: ['info', 'En cola: todavía no se pidió el envío al teléfono.'],
            SENDING: ['info', 'Entregándose a Android...'],
            ACCEPTED_BY_ANDROID: ['warning', 'Android aceptó la solicitud, pero aún no confirmó que haya salido. No reenvíe a ciegas.'],
            SENT_BY_MODEM: ['success', 'Enviado por el teléfono (sin confirmación de entrega).'],
            DELIVERED_CONFIRMED: ['success', 'Entrega confirmada por la operadora.'],
            DELIVERY_FAILED: ['warning', 'Salió del teléfono, pero la operadora informó que NO se entregó.'],
            UNKNOWN: ['warning', 'No se sabe si salió. No se reenviará automáticamente.'],
            FAILED: ['danger', 'No enviado.']
        };

        function mostrar(clase, texto) {
            var el = document.getElementById('resultado');
            el.className = 'alert alert-' + clase;
            el.textContent = texto;
            el.style.display = 'block';
        }

        function call() {
            var numero = document.getElementById('numero').value;
            var mensaje = document.getElementById('texto').value;
            var token = document.getElementById('token').value;
            try { sessionStorage.setItem('osms_token', token); } catch (e) { }

            var headers = { 'Content-Type': 'application/json' };
            if (token) { headers['Authorization'] = 'Bearer ' + token; }

            fetch('v1/sms/', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ phone: numero, message: mensaje, wait: true })
            }).then(function (res) {
                return res.json().then(function (data) { return { status: res.status, data: data }; });
            }).then(function (r) {
                if (r.status === 401) {
                    mostrar('danger', 'Token ausente o incorrecto.');
                } else if (r.data.error) {
                    mostrar('danger', 'No enviado: ' + (r.data.message || r.data.error));
                } else {
                    var m = MENSAJES[r.data.state] || ['secondary', 'Estado: ' + r.data.state];
                    mostrar(m[0], m[1]);
                }
            }).catch(function () {
                mostrar('danger', 'No se pudo contactar con el servidor.');
            });
        }

        window.addEventListener('load', function () {
            try {
                var t = sessionStorage.getItem('osms_token');
                if (t) { document.getElementById('token').value = t; }
            } catch (e) { }
        });
    </script>

</head>

<body>
    <div class="container">
        <h1 class="">Inicio</h1>
        <p>Enviar SMS</p>
        <div>
            <div class="mb-3">
                <label for="numero" class="form-label">Número</label>
                <input type="text" class="form-control" id="numero" placeholder="+595981123456 o 0981123456" name="phone">
            </div>
            <div class="mb-3">
                <label for="texto" class="form-label">Texto</label>
                <textarea class="form-control" id="texto" rows="3" name='message'></textarea>
            </div>
            <div class="mb-3">
                <label for="token" class="form-label">Token (si el servidor lo exige)</label>
                <input type="password" class="form-control" id="token" autocomplete="off">
            </div>
            <button class="btn btn-success" type="button" onclick="call()">Enviar</button>
        </div>
        <div class="mt-3">
            <div class="alert" role="alert" id="resultado" style="display: none;"></div>
        </div>
    </div>
</body>

</html>
